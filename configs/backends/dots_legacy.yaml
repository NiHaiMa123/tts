backend_id: dots_legacy
family: dots
enabled: true

worker:
  python: ${DOTSTTS_ROOT}/.venv/Scripts/python.exe
  cwd: ${DOTSTTS_ROOT}
  script: workers/dots_worker.py
  startup_timeout_seconds: 600
  env:
    HF_HUB_OFFLINE: "1"

model:
  path_or_id: ${DOTSTTS_ROOT}/pretrained_models/dots.tts-soar
  revision: 2f9b3e18d70d670d4c701da2dc55ded5755815ce
  adapter: ${DOTSTTS_ROOT}/data/work/suoming/suoming_lora_v1/checkpoint-00000500/model

runtime:
  precision: bfloat16
  optimize: true
  max_generate_length: 500
  max_sequence_length: 2048
  vocoder_merge_steps: 4
  warmup_on_optimize: true
  merge_lora: true

generation:
  language: chinese
  template_name: tts
  normalize_text: false
  soften_emphasis: true
  speaker_scale: 1.5
  ode_method: euler
  num_steps: 16
  guidance_scale: 1.2
  base_seed: 42

notes: >
  Legacy quality baseline. Uses the old dotstts venv and runtime; the
  platform only talks to it through the JSONL worker protocol. No new
  training — the adapter is the existing Step-500 LoRA artifact.
