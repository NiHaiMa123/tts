# 爱弥斯 VoxCPM2 LoRA pilot — auditable copy of the OFFICIAL template
# upstream: OpenBMB/VoxCPM conf/voxcpm_v2/voxcpm_finetune_lora.yaml
#           @ tag 2.0.3 (commit 19b6bf7590025418821a86dcb817504e0ad7e5df)
# entry:    scripts/lora/train_voxcpm_lora_pilot.py --config <this> --out <dir>
# 动机: 零样本 cos_centroid 仅 ~0.84（锁暝 0.92+），换参考音后 0.93 但
#       局部仍飘——试试 180 条冻结 train 能否再抬一档。
pretrained_path: E:/project/tts/hf_cache/voxcpm2/models--openbmb--VoxCPM2/snapshots/32279effe8c19989596f05d353d1447f51d9e915
train_manifest: E:/project/tts/outputs/training/aimisi_voxcpm_lora_pilot/train.jsonl
val_manifest: E:/project/tts/outputs/training/aimisi_voxcpm_lora_pilot/val_metrics.jsonl
sample_rate: 16000         # AudioVAE encoder input rate
out_sample_rate: 48000     # AudioVAE decoder output rate
batch_size: 1              # 16GB VRAM
grad_accum_steps: 8        # effective batch = 8
num_workers: 0             # Windows spawn safety
num_iters: 150             # hard cap = 150 OPTIMIZER steps
log_interval: 10
valid_interval: 50
save_interval: 50          # step_0000050 / step_0000100 / step_0000150
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 10
max_steps: 150             # scheduler horizon == num_iters
max_batch_tokens: 8192
max_grad_norm: 1.0
save_path: E:/project/tts/outputs/training/aimisi_voxcpm_lora_pilot/checkpoints
tensorboard: E:/project/tts/outputs/training/aimisi_voxcpm_lora_pilot/tb
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 16
  alpha: 16
  dropout: 0.0
