# 爱弥斯 VoxCPM2 LoRA v2 — 预处理数据集重训（修"磨砂"）
# 与 v1 pilot 唯一差异：train/val 换成 inbox_clean(ZipEnhancer降噪+
# trim+高通+响度归一)标准化出的 datasets/v2。LoRA/超参不变，做唯一
# 变量对比。
pretrained_path: E:/project/tts/hf_cache/voxcpm2/models--openbmb--VoxCPM2/snapshots/32279effe8c19989596f05d353d1447f51d9e915
train_manifest: E:/project/tts/outputs/training/aimisi_lora_v2/train.jsonl
val_manifest: E:/project/tts/outputs/training/aimisi_lora_v2/val_metrics.jsonl
sample_rate: 16000
out_sample_rate: 48000
batch_size: 1
grad_accum_steps: 8
num_workers: 0
num_iters: 150
log_interval: 10
valid_interval: 50
save_interval: 50
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 10
max_steps: 150
max_batch_tokens: 8192
max_grad_norm: 1.0
save_path: E:/project/tts/outputs/training/aimisi_lora_v2/checkpoints
tensorboard: E:/project/tts/outputs/training/aimisi_lora_v2/tb
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 16
  alpha: 16
  dropout: 0.0
