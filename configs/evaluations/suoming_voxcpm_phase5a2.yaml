  audio: ${DOTSTTS_ROOT}/data/work/standardized/bc/bc65e163165392b422ade1698fc883048908c147ac873fd8e6e728fae0f8ba0f.wav
  sha256: 55656bc9abc7ba33ca1fb71c0c557bf2bc9e773fa105daec68f63346b9a93bd8
