  audio: ${DOTSTTS_ROOT}/data/inbox/锁暝/中立_neutral/【中立_neutral】谛天鉴除了处理岁主事务，也掌管天文、历法。各州分鉴各有职责，梦州也有自己——唔……先前御者说对谛天鉴了解不多，不知不觉话多了些。总之，谛天鉴为岁主尽责，那自然，.wav
  sha256: c4322e3230ab952edb7cd456329cb5b48195d9f33c5459c0ba76d8d79d3a7f92
  text: 谛天鉴除了处理岁主事务，也掌管天文、历法。各州分鉴各有职责，梦州也有自己——唔……先前御者说对谛天鉴了解不多，不知不觉话多了些。总之，谛天鉴为岁主尽责，那自然，御者若有所求，无论缘由，我都会回应。
- id: P2
  role: candidate
  split: validation
  source: datasets/suoming/v1/validation.jsonl#0 fid=27cd4b76528acdb6
  audio: ${DOTSTTS_ROOT}/data/work/standardized/e6/e60e291ffb3431fadc10be7089662e9e24274476fd48b9d42bde3f921a18cbd7.wav
  sha256: fb77c9bb8f4ad75d311e568171dca73c34be001dcf8fe11fbcc018aab66e29cb
  text: 我始终想着，有一日能回到华亭，住进一间小屋。若这里需要我，我便出手相助；若不需要，便与九契他们一同，看小城在风平浪静中日来月往，如此便足够了。当然，那还是很遥远的事，眼下，心月狐与梦州大局为先。

