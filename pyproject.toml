[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "character-tts"
version = "0.1.0"
description = "Backend-agnostic character TTS platform (Dots legacy / VoxCPM2 / Qwen3-TTS)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "scipy>=1.11",
]

[project.optional-dependencies]
metrics = ["pyloudnorm>=0.1.4"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that load real models or launch real backend workers",
]
